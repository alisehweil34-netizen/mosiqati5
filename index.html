<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>موسيقاتي — تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at 50% 45%, #211c12 0%, #14110b 45%, #0a0908 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .login-scene {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3.5rem;
      padding: 2rem;
      max-width: 980px;
      width: 100%;
    }

    .lamp-illustration {
      flex: 0 0 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 320px;
    }

    .lamp-glow {
      position: absolute;
      top: 12%;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,244,214,0.22) 0%, rgba(255,224,150,0.08) 40%, transparent 72%);
      filter: blur(2px);
      animation: lampPulse 4s ease-in-out infinite;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    @keyframes lampPulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.04); }
    }

    .lamp {
      position: relative;
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .lamp-shade {
      width: 190px;
      height: 100px;
      background: linear-gradient(180deg, #fffdf6 0%, #fbeecb 60%, #eeddad 100%);
      border-radius: 190px 190px 14px 14px;
      box-shadow:
        0 0 45px 10px rgba(255, 236, 180, 0.55),
        0 10px 25px rgba(0,0,0,0.35);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    /* ===== حالة المصباح مطفأ ===== */
    .lamp-illustration.off .lamp-glow { opacity: 0; }

    .lamp-illustration.off .lamp-shade {
      background: linear-gradient(180deg, #55524a 0%, #423f38 60%, #35322c 100%);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .lamp-illustration.off .lamp-cord::after {
      background: #7d7a70;
      box-shadow: none;
    }

    .lamp-illustration.off .lamp-shadow-floor { opacity: 0.35; }

    .lamp-cord {
      cursor: pointer;
    }

    .lamp-cord:hover::after {
      box-shadow: 0 0 12px rgba(201,168,76,0.9);
    }

    .lamp-cord.pulling::after {
      animation: cordPull 0.35s ease;
    }

    @keyframes cordPull {
      0%   { transform: translateX(-50%) translateY(0); }
      40%  { transform: translateX(-50%) translateY(10px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    .lamp-neck {
      width: 8px;
      height: 34px;
      background: linear-gradient(180deg,#d9d9d9,#9a9a9a);
      border-radius: 2px;
    }

    .lamp-pole {
      width: 6px;
      height: 110px;
      background: linear-gradient(180deg,#e4e4e4,#8f8f8f);
      border-radius: 3px;
    }

    .lamp-base {
      width: 74px;
      height: 14px;
      background: linear-gradient(180deg,#e9e9e9,#8a8a8a);
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .lamp-cord {
      position: absolute;
      top: 78px;
      left: 50%;
      width: 1px;
      height: 46px;
      background: #cfcfcf99;
    }

    .lamp-cord::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff2c8, #c9a84c);
      box-shadow: 0 0 8px rgba(201,168,76,0.6);
    }

    .lamp-shadow-floor {
      margin-top: 14px;
      width: 130px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,0.55) 0%, transparent 70%);
      transition: opacity 0.4s ease;
    }

    .login-card {
      flex: 0 0 380px;
      background: rgba(20,18,14,0.55);
      border: 1px solid rgba(201,168,76,0.22);
      border-radius: 20px;
      padding: 2.4rem 2.2rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
      position: relative;
      transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
      opacity: 1;
      transform: scale(1);
    }

    .login-card.hidden-card {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
      visibility: hidden;
    }

    .logo-area { text-align: center; margin-bottom: 1.4rem; }

    .logo-img-wrap {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 1px solid #c9a84c33;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 0.8rem;
      background: #111;
      box-shadow: 0 0 30px rgba(201,168,76,0.12);
    }

    .logo-img-wrap img { width: 40px; height: 40px; object-fit: contain; }

    .logo-name { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .logo-name span { color: #c9a84c; }

    .login-heading { text-align: center; margin-bottom: 1.6rem; }
    .login-heading h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #f4e9c8;
      letter-spacing: 0.5px;
      margin-bottom: 0.35rem;
    }
    .login-heading p { font-size: 0.83rem; color: #8a8474; }

    .field { margin-bottom: 1.15rem; position: relative; }

    .field label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: #b3aa8e;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      direction: ltr;
      text-align: right;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }

    .field input::placeholder { color: #55503f; direction: ltr; text-align: left; }

    .field input:focus {
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
      background: rgba(255,255,255,0.06);
    }

    .field input.error { border-color: #e05555 !important; box-shadow: 0 0 0 3px rgba(224,85,85,0.1) !important; }
    .field input.success { border-color: #4caf73 !important; box-shadow: 0 0 0 3px rgba(76,175,115,0.08) !important; }

    .field-msg {
      font-size: 0.72rem;
      margin-top: 0.4rem;
      min-height: 1rem;
      display: none;
    }
    .field-msg.show { display: block; }
    .field-msg.err { color: #e05555; }
    .field-msg.ok  { color: #4caf73; }

    .forgot { text-align: left; margin-top: 0.4rem; }
    .forgot a { font-size: 0.74rem; color: #c9a84c99; text-decoration: none; transition: color 0.2s; }
    .forgot a:hover { color: #c9a84c; }

    .alert-box {
      display: none;
      background: rgba(224,85,85,0.1);
      border: 1px solid #e0555544;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: #e07777;
      text-align: center;
    }
    .alert-box.show { display: block; }
    .alert-box.success-box {
      background: rgba(76,175,115,0.1);
      border-color: #4caf7344;
      color: #4caf73;
    }

    .btn-enter {
      display: block; width: 100%; padding: 0.9rem; margin-top: 1.4rem;
      background: linear-gradient(180deg, #e8cf8f, #c9a84c);
      color: #201a08; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; font-family: inherit; letter-spacing: 1px;
      cursor: pointer; text-align: center; text-decoration: none;
      transition: background 0.25s, box-shadow 0.25s, transform 0.15s;
    }
    .btn-enter:hover { box-shadow: 0 8px 24px rgba(201,168,76,0.35); transform: translateY(-1px); }
    .btn-enter:active { transform: translateY(0); }
    .btn-enter:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; color: #ccc; }

    .form-foot { text-align: center; margin-top: 1.4rem; font-size: 0.82rem; color: #7a7462; }
    .form-foot a { color: #c9a84c; text-decoration: none; font-weight: 600; margin-right: 0.3rem; }
    .form-foot a:hover { color: #d4b55a; }

    .copy { margin-top: 1.6rem; font-size: 0.68rem; color: #3a3527; letter-spacing: 1px; text-align: center; }

    @media (max-width: 820px) {
      .login-scene { flex-direction: column; gap: 1rem; }
      .lamp-illustration { height: 220px; flex-basis: auto; }
      .login-card { width: 100%; max-width: 400px; }
    }

    @media (max-width: 500px) {
      .login-card { padding: 2rem 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="login-scene">

    <div class="lamp-illustration">
      <div class="lamp-glow"></div>
      <div class="lamp">
        <div class="lamp-shade"></div>
        <div class="lamp-cord"></div>
        <div class="lamp-neck"></div>
        <div class="lamp-pole"></div>
        <div class="lamp-base"></div>
      </div>
      <div class="lamp-shadow-floor" style="position:absolute; bottom:0;"></div>
    </div>

    <div class="login-card">

      <div class="logo-area">
        <div class="logo-img-wrap">
          <img src="logo.png" alt="موسيقاتي">
        </div>
        <div class="logo-name">موسيقا<span>تي</span></div>
      </div>

      <div class="login-heading">
        <h1 data-ar="أهلاً بعودتك" data-en="Welcome">أهلاً بعودتك</h1>
        <p data-ar="أدخل بياناتك للمتابعة" data-en="Enter your credentials to continue">أدخل بياناتك للمتابعة</p>
      </div>

      <div class="alert-box" id="alertBox"></div>

      <div class="field">
        <label data-ar="البريد الإلكتروني" data-en="Username">البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="example@email.com" oninput="validateLoginEmail()">
        <div class="field-msg" id="emailMsg"></div>
      </div>

      <div class="field">
        <label data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
        <input type="password" id="loginPass" placeholder="••••••••" oninput="validateLoginPass()">
        <div class="field-msg" id="passMsg"></div>
        <div class="forgot"><a href="#" data-ar="نسيت كلمة المرور؟" data-en="Forgot password?">نسيت كلمة المرور؟</a></div>
      </div>

      <button class="btn-enter" onclick="submitLogin()" data-ar="دخول" data-en="Sign In">دخول</button>

      <div class="form-foot">
        <span data-ar="ليس لديك حساب؟" data-en="Don't have an account?">ليس لديك حساب؟</span> <a href="register.html" data-ar="سجّل الآن" data-en="Register Now">سجّل الآن</a>
      </div>

      <div class="copy"><span data-ar="© 2026 موسيقاتي — جميع الحقوق محفوظة" data-en="© 2026 MOSIQATI — All Rights Reserved">© 2026 موسيقاتي — جميع الحقوق محفوظة</span></div>

    </div>

  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
<script>
    function setFieldState(inputId, msgId, isOk, msg) {
      const input = document.getElementById(inputId);
      const msgEl = document.getElementById(msgId);
      input.classList.toggle('error', !isOk);
      input.classList.toggle('success', isOk);
      msgEl.textContent = msg;
      msgEl.className = 'field-msg show ' + (isOk ? 'ok' : 'err');
    }

    function clearField(inputId, msgId) {
      const input = document.getElementById(inputId);
      const msgEl = document.getElementById(msgId);
      input.classList.remove('error', 'success');
      msgEl.className = 'field-msg';
      msgEl.textContent = '';
    }

    function validateLoginEmail() {
      const val = document.getElementById('loginEmail').value.trim();
      if (!val) { clearField('loginEmail','emailMsg'); return false; }
      const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      setFieldState('loginEmail','emailMsg', ok, ok ? (getLang()==='en'?'Valid email ✓':'بريد إلكتروني صحيح ✓') : (getLang()==='en'?'Invalid email format':'صيغة البريد الإلكتروني غير صحيحة'));
      return ok;
    }

    function validateLoginPass() {
      const val = document.getElementById('loginPass').value;
      if (!val) { clearField('loginPass','passMsg'); return false; }
      const ok = val.length >= 6;
      setFieldState('loginPass','passMsg', ok, ok ? (getLang()==='en'?'Password accepted ✓':'كلمة المرور مقبولة ✓') : (getLang()==='en'?'Password must be at least 6 characters':'كلمة المرور يجب أن تكون 6 أحرف على الأقل'));
      return ok;
    }

    function showAlert(msg, isSuccess) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = 'alert-box show' + (isSuccess ? ' success-box' : '');
    }

    function hideAlert() {
      document.getElementById('alertBox').className = 'alert-box';
    }

    async function submitLogin() {
      hideAlert();
      const emailOk = validateLoginEmail();
      const passOk  = validateLoginPass();

      const emailVal = document.getElementById('loginEmail').value.trim();
      const passVal  = document.getElementById('loginPass').value;

      if (!emailVal && !passVal) {
        showAlert(getLang()==='en'?'Please fill in all required fields':'يرجى ملء جميع الحقول المطلوبة');
        playSound('error');
        return;
      }
      if (!emailOk || !passOk) {
        showAlert(getLang()==='en'?'Please fix the errors before continuing':'يرجى تصحيح الأخطاء الموجودة قبل المتابعة');
        playSound('error');
        return;
      }

      if (!db) {
        showAlert(getLang()==='en'?'Could not connect to Firebase, please try again':'تعذّر الاتصال بـ Firebase، حاول مجدداً');
        return;
      }

      const btn = document.querySelector('.btn-enter');
      btn.disabled = true;
      btn.textContent = getLang()==='en' ? 'Checking...' : 'جارٍ التحقق...';

      try {
        const encoder    = new TextEncoder();
        const hashBuf    = await crypto.subtle.digest('SHA-256', encoder.encode(passVal));
        const hashArr    = Array.from(new Uint8Array(hashBuf));
        const hashedPass = hashArr.map(b => b.toString(16).padStart(2, '0')).join('');

        const snapshot = await db.ref('users').orderByChild('email').equalTo(emailVal).once('value');

        if (!snapshot.exists()) {
          showAlert('⚠️ البريد الإلكتروني غير مسجل');
          playSound('error');
          btn.disabled = false;
          btn.textContent = getLang()==='en' ? 'Sign In' : 'دخول';
          return;
        }

        let matched  = false;
        let userData = null;
        let userId   = null;
        snapshot.forEach(child => {
          if (child.val().password === hashedPass) {
            matched  = true;
            userData = child.val();
            userId   = child.key;
          }
        });

        if (!matched) {
          showAlert('⚠️ كلمة المرور غير صحيحة');
          playSound('error');
          btn.disabled = false;
          btn.textContent = getLang()==='en' ? 'Sign In' : 'دخول';
          return;
        }

        localStorage.setItem('mosiqati-user', JSON.stringify({ id: userId, name: userData.full_name, email: userData.email, phone: userData.phone || '' }));

        showAlert('✅ تم تسجيل الدخول بنجاح', true);
        setTimeout(() => { window.location.href = 'home.html'; }, 1200);

      } catch (err) {
        console.error(err);
        showAlert(getLang()==='en'?'An error occurred, please try again':'حدث خطأ، حاول مجدداً');
        btn.disabled = false;
        btn.textContent = getLang()==='en' ? 'Sign In' : 'دخول';
      }
    }
  </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const lampIllustration = document.querySelector('.lamp-illustration');
  const lampCord = document.querySelector('.lamp-cord');
  const loginCard = document.querySelector('.login-card');

  function toggleLamp() {
    const isOff = lampIllustration.classList.toggle('off');
    lampCord.classList.remove('pulling');
    void lampCord.offsetWidth; // إعادة تشغيل الأنيميشن
    lampCord.classList.add('pulling');
    if (loginCard) loginCard.classList.toggle('hidden-card', isOff);
  }

  if (lampCord) lampCord.addEventListener('click', toggleLamp);
  if (lampIllustration) lampIllustration.addEventListener('click', function(e){
    if (e.target === lampCord || lampCord.contains(e.target)) return;
    toggleLamp();
  });
});
</script>

<button class="music-toggle" id="musicToggle" title="تشغيل/إيقاف الموسيقى">🎵</button>

<script>
document.addEventListener('DOMContentLoaded',function(){
 const bar=document.querySelector('.top-bar');
 if(!bar) return;
 const observer=new MutationObserver(function(){
   if(bar.style.display==='none' || bar.classList.contains('hidden')){
      document.querySelector('.navbar')?.style.setProperty('top','0px');
   }
 });
 observer.observe(bar,{attributes:true,attributeFilter:['style','class']});
});
</script>
